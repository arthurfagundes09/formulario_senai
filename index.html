<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição E-sports</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Inscrição no Campeonato de E-sports</h1>

    <form>

        <div class="form-control">
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome">
        </div>

        <div class="form-control">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email">
        </div>

        <div class="form-control">
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone">
        </div>

        <div class="form-control">
            <label for="data">Data de nascimento:</label>
            <input type="date" id="data" name="data">
        </div>

        <div class="form-control">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha">
        </div>

        <div class="form-control">
            <label for="jogo">Escolha o jogo:</label>
            <select id="jogo" name="jogo">
                <option value="valorant">Valorant</option>
                <option value="cs2">Counter-Strike 2</option>
                <option value="fortnite">Fortnite</option>
                <option value="lol">League of Legends</option>
            </select>
        </div>

        <div class="form-control">
            <label for="nick">Nick do jogador:</label>
            <input type="text" id="nick" name="nick">
        </div>

        <div class="form-control">
            <input type="submit" value="Realizar inscrição">
        </div>

    </form>

</body>
</html>
